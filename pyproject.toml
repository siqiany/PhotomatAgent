[project]
name = "photomatagent"
version = "0.5.0"
description = "A minimal, extensible Scientific Agent Runtime for materials science research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "openai>=1.100",
    "anthropic>=0.60",
    "pymatgen>=2024.10",
    "coverage>=7.6,<8",
    "mcp>=1.24,<2",
]

[project.optional-dependencies]
materials = [
    "mp-api[mcp]>=0.44",
]
electronic = [
    "sumo>=2.4",
    "effmass>=1.3",
]
literature = [
    "arxiv>=2.1",
    "pypdf>=4.0",
    "docling>=2.0",
    "lancedb>=0.15",
    "pylance>=0.20",
    "sentence-transformers>=3.0",
    # Direct torch pins so the CPU-only index below actually applies (uv
    # ignores index sources for purely transitive deps).
    "torch>=2.2",
    "torchvision>=0.17",
]
defects = [
    "doped>=2.0",
]
transport = [
    "amset>=0.5",
]
device = [
    "devsim>=2.9",
]
optics = [
    "pytaser>=1.0",
]
generation = [
    "torch>=2.2",
]
science = [
    "photomatagent[materials,electronic,literature,defects,transport,device,optics,generation]",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# CPU-only torch: the default PyPI CUDA-13 wheels currently ship a broken
# nvidia-curand wheel, and this project runs retrieval locally on CPU anyway.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
photomatagent = "photomatagent.cli.app:main"
photomatagent-mcp-scnet = "photomatagent.mcp_servers.scnet.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photomatagent"]

[tool.pytest.ini_options]
addopts = "--capture=no"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false

[tool.hatch.build.targets.sdist]
include = ["skills/"]
