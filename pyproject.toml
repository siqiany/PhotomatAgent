[project]
name = "photomatagent"
version = "0.5.0"
description = "A minimal, extensible Scientific Agent Runtime for materials science research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "openai>=1.100",
    "anthropic>=0.60",
    "pymatgen>=2024.10",
]

[project.optional-dependencies]
materials = [
    "mp-api>=0.44",
]
electronic = [
    "sumo>=2.4",
    "effmass>=1.3",
]
literature = [
    "arxiv>=2.1",
    "pypdf>=4.0",
]
defects = [
    "doped>=2.0",
]
transport = [
    "amset>=0.5",
]
device = [
    "devsim>=2.9",
]
optics = [
    "pytaser>=1.0",
]
science = [
    "photomatagent[materials,electronic,literature,defects,transport,device,optics]",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
photomatagent = "photomatagent.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photomatagent"]

[tool.pytest.ini_options]
addopts = "--capture=no"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["skills/"]
